# Build, migrate and deploy one VAE environment (DES-008).
# Run by the vae-<env>-deploy Cloud Build trigger (infra/terraform/modules/vae-env):
#   a push to staging deploys stage (hl-vae-stage).
# The trigger reads this file from the pushed branch on GitHub.
# No step reads the app secret; only the runtime service account can.
substitutions:
  _ENV: stage
  _REGION: us-west1
  _IMAGE: us-west1-docker.pkg.dev/hl-vae-stage/vae-images/vae
  _START_SQL: "true"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 5400s

steps:
- id: pull-cache
  name: gcr.io/cloud-builders/docker
  entrypoint: bash
  args: ['-c', 'docker pull $_IMAGE:$_ENV || exit 0']

- id: build
  name: gcr.io/cloud-builders/docker
  args: ['build', '-t', '$_IMAGE:$SHORT_SHA', '-t', '$_IMAGE:$_ENV', '--cache-from', '$_IMAGE:$_ENV', '.']

- id: push
  name: gcr.io/cloud-builders/docker
  args: ['push', '--all-tags', '$_IMAGE']

# The database is stopped by default; start it (the nightly scheduler stops it
# again). Starting can take ~15 min, longer than gcloud waits, so start it
# async and poll (up to 30 min). A failed patch (e.g. a start already in
# progress) still falls through to the poll. The instance can report RUNNABLE
# before the start finishes, so also wait for its operations.
- id: start-sql
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args:
  - -c
  - |
    if [ "$_START_SQL" = "true" ]; then
      gcloud sql instances patch vae-$_ENV-sql --activation-policy=ALWAYS --async --quiet ||
        echo "patch failed; waiting for the instance anyway"
      for i in $$(seq 60); do
        pending=$$(gcloud sql operations list --instance=vae-$_ENV-sql --limit=10 --filter='status!=DONE' --format='value(name)')
        state=$$(gcloud sql instances describe vae-$_ENV-sql --format='value(state)')
        echo "vae-$_ENV-sql: $$state, pending operations: $${pending:-none}"
        [ -z "$$pending" ] && [ "$$state" = "RUNNABLE" ] && exit 0
        sleep 30
      done
      echo "vae-$_ENV-sql not RUNNABLE after 30 min" >&2
      exit 1
    fi

- id: migrate
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args:
  - -c
  - |
    gcloud run jobs update vae-$_ENV-migrate --region=$_REGION --image=$_IMAGE:$SHORT_SHA &&
    gcloud run jobs execute vae-$_ENV-migrate --region=$_REGION --wait &&
    gcloud run jobs update vae-$_ENV-manage --region=$_REGION --image=$_IMAGE:$SHORT_SHA

- id: deploy-web
  name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  args: ['gcloud', 'run', 'deploy', 'vae-$_ENV-web', '--region=$_REGION', '--image=$_IMAGE:$SHORT_SHA']
