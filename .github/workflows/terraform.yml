# Terraform checks (DES-005). Runs only when infra/terraform/ changes, so it's
# dormant until DES-008 adds that directory. Not a required check (a path
# filter would leave it pending). No backend and no credentials: plan and
# apply stay manual (DES-008).
name: Terraform

on:
  pull_request:
    branches: [develop, staging, main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [develop, staging, main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "^1.5.0" # DES-008 requires >= 1.5

      - name: Format
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate
        if: success() || failure()
        run: |
          for root in shared envs/stage; do
            echo "::group::terraform validate infra/terraform/$root"
            terraform -chdir="infra/terraform/$root" init -backend=false -input=false
            terraform -chdir="infra/terraform/$root" validate
            echo "::endgroup::"
          done
