[project]
name = "hl_vae"
version = "0.0.0"
description = "Veteran Academic Exchange"
readme = "README.md"
dependencies = [
  "Django>=5.1,<6.0",
]
authors = [
  { name = "Jeff Stock", email = "jeff.stock@hiredlabs.org" },
  { name = "Daniel Murillo", email = "daniel.murillo@hiredlabs.org"},
]

requires-python = ">=3.12"

license = "MIT"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-django>=4.8,<5.0",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hl_vae", "works"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hl_vae.settings.test"
python_files = ["tests.py", "test_*.py"]

[project.urls]
"Homepage" = "https://veteranacademicexchange.org/"
